<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FIELDOPS — Entrar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./../../styles.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="login-page">
    <header>
    </header>

    <section class="login-center">
      <div class="login-card card border-0">
        <div class="card-body">
          <a class="brand d-flex align-items-center justify-content-center text-decoration-none" href="#" aria-label="FIELDOPS — Início">
            <span class="brand-mark d-inline-flex align-items-center justify-content-center">
              <i class="bi bi-shield-fill-check" aria-hidden="true"></i>
            </span>
            <span class="brand-copy">
              <strong>FIELDOPS</strong>
              <small>INSPEÇÕES &amp; AUDITORIA</small>
            </span>
          </a>

          <h1>Entrar na sua conta</h1>
          <p class="login-subtitle">Acesse o painel de inspeções e auditoria</p>

          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label class="form-label" for="email">E-mail corporativo</label>
              <div class="input-group login-input">
                <span class="input-group-text"><i class="bi bi-envelope" aria-hidden="true"></i></span>
                <input class="form-control" id="email" name="email" type="email"
                  value="mariana.souza@fieldops.com" autocomplete="email" required />
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex align-items-center justify-content-between">
                <label class="form-label" for="password">Senha de acesso</label>
                <a class="forgot-link" href="#">Esqueceu a senha?</a>
              </div>
              <div class="input-group login-input">
                <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
                <input class="form-control" id="password" name="password" type="password"
                  value="senha123456" autocomplete="current-password" required />
                <button class="btn password-toggle" id="passwordToggle" type="button" aria-label="Mostrar senha"
                  aria-controls="password">
                  <i class="bi bi-eye" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <div class="d-flex align-items-center justify-content-between mb-3">
              <div class="form-check">
                <input class="form-check-input" id="remember" type="checkbox" checked />
                <label class="form-check-label" for="remember">Lembrar de mim</label>
              </div>
            </div>

            <button class="btn btn-primary login-button w-100" type="submit">
              <span>Entrar</span>
              <i class="bi bi-arrow-right" aria-hidden="true"></i>
            </button>

            <div class="divider"><span>OU<br />CONTINUE COM</span></div>

            <div class="row g-2">
              <div class="col-6">
                <button class="btn social-button w-100" type="button">
                  <span class="google-icon" aria-hidden="true">G</span>
                  <span>Google</span>
                </button>
              </div>
              <div class="col-6">
                <button class="btn social-button w-100" type="button">
                  <span class="microsoft-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                  <span>Microsoft</span>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <p class="access-help">
        Não tem uma conta? <a href="./cadastro/index.html">Cadastrar</a>
      </p>
    </section>

    <footer class="login-footer">
      <nav aria-label="Links institucionais">
        <a href="#">Termos de Uso</a>
        <span aria-hidden="true">•</span>
        <a href="#">Privacidade</a>
        <span aria-hidden="true">•</span>
        <a href="#"><i class="bi bi-circle" aria-hidden="true"></i> ISO 19011</a>
      </nav>
      <p>© 2025 FieldOps Inspection Suite. Todos os direitos reservados.</p>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./login.js"></script>
</body>

</html>
