<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FIELDOPS — Criar conta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./../../../styles.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="registration-page">
    <section class="registration-center" aria-label="Cadastro corporativo">
      <div class="registration-card card border-0">
        <div class="card-body">
          <a class="brand d-flex align-items-center justify-content-center text-decoration-none" href="#" aria-label="FIELDOPS — Início">
            <span class="brand-mark d-inline-flex align-items-center justify-content-center">
              <i class="bi bi-shield-fill-check" aria-hidden="true"></i>
            </span>
            <span class="brand-copy">
              <strong>FIELDOPS</strong>
              <small>INSPEÇÕES &amp; AUDITORIA</small>
            </span>
          </a>

          <h1>Criar conta corporativa</h1>
          <p class="registration-subtitle">Inicie seu teste gratuito de 14 dias da plataforma</p>

          <form id="registrationForm" novalidate>
            <div class="mb-3">
              <label class="form-label" for="fullName">Nome Completo</label>
              <div class="input-group registration-input">
                <span class="input-group-text"><i class="bi bi-person" aria-hidden="true"></i></span>
                <input class="form-control" id="fullName" name="fullName" type="text"
                  placeholder="Eng. Rafael Silva" autocomplete="name" required />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="email">E-mail Corporativo</label>
              <div class="input-group registration-input">
                <span class="input-group-text"><i class="bi bi-at" aria-hidden="true"></i></span>
                <input class="form-control" id="email" name="email" type="email"
                  placeholder="seu.nome@empresa.com.br" autocomplete="email" required />
              </div>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-12 col-sm-6">
                <label class="form-label" for="company">Empresa</label>
                <div class="input-group registration-input">
                  <span class="input-group-text"><i class="bi bi-building" aria-hidden="true"></i></span>
                  <input class="form-control" id="company" name="company" type="text"
                    placeholder="Nome da empresa" autocomplete="organization" required />
                </div>
              </div>

              <div class="col-12 col-sm-6">
                <label class="form-label" for="role">Perfil / Cargo</label>
                <div class="input-group registration-input">
                  <span class="input-group-text"><i class="bi bi-briefcase" aria-hidden="true"></i></span>
                  <select class="form-select" id="role" name="role" required>
                    <option value="">Selecione</option>
                    <option value="gerente" selected>Gestor / Gerente</option>
                    <option value="engenheiro">Engenheiro</option>
                    <option value="auditor">Auditor</option>
                    <option value="tecnico">Técnico</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex align-items-center justify-content-between">
                <label class="form-label" for="password">Senha</label>
                <small class="password-hint">Mín. 8 caracteres</small>
              </div>
              <div class="input-group registration-input">
                <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
                <input class="form-control" id="password" name="password" type="password"
                  placeholder="••••••••" minlength="8" autocomplete="new-password" required />
                <button class="btn password-toggle" id="passwordToggle" type="button"
                  aria-label="Mostrar senha" aria-controls="password">
                  <i class="bi bi-eye-slash" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <div class="form-check terms-check mb-3">
              <input class="form-check-input" id="terms" name="terms" type="checkbox" required />
              <label class="form-check-label" for="terms">
                Concordo com os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a>.
              </label>
            </div>

            <button class="btn btn-primary registration-button w-100" type="submit">
              <i class="bi bi-arrow-right" aria-hidden="true"></i>
              <span>Cadastrar Organização</span>
            </button>
          </form>
        </div>
      </div>

      <p class="login-help">Já tem uma conta? <a href="./../index.html">Fazer login</a></p>
    </section>

    <footer class="registration-footer">
      <p>© 2025 FieldOps Inspection Suite. Todos os direitos reservados.</p>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./cadastro.js"></script>
</body>

</html>
