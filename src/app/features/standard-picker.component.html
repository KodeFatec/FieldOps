<main class="page-content"><div class="page-heading"><div><span class="eyebrow">MODELOS BASEADOS EM NORMAS</span><h1>Comece por uma Norma Regulamentadora</h1><p>Selecione uma referência para iniciar a estrutura do checklist.</p></div><a routerLink="/app/inspection-templates" class="btn btn-outline-secondary">Voltar</a></div><div class="row g-3"><div class="col-12 col-md-6 col-xl-4" *ngFor="let item of standards"><button class="card card-body h-100 w-100 text-start" [class.border-primary]="selected===item.code" (click)="selected=item.code"><span class="kpi-icon"><i class="bi bi-shield-check"></i></span><strong class="mt-3">{{item.code}}</strong><span class="d-block fw-semibold">{{item.title}}</span><small class="text-body-secondary mt-2">{{item.category}}</small></button></div></div><div class="d-flex justify-content-end mt-4"><button class="btn btn-primary" (click)="useStandard()">Criar checklist a partir de {{selected}} <i class="bi bi-arrow-right ms-1"></i></button></div></main>
